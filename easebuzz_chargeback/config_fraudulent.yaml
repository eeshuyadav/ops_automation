# =============================================================================
#   FRAUDULENT TRANSACTION chargeback automation config.
#
#   Trigger format (example):
#       Re: Urgent Attention Required: Fraudulent Transaction!! E2605060Y9FK7N
#
#   Same Easebuzz body shape as L1/L2/L3 (Case ID, Transaction ID, Customer
#   fields in a header/data table). Reuses main.py — only the subject regex,
#   labels, template, and tracker target_section differ.
#
#   Success rows go into the "Fraudulent Transaction!!" sub-section of the
#   monthly L2 tab ({month} 26 L2) — same pattern as L3's Arbitration section.
# =============================================================================

# --- Auth: shared OAuth token with L1/L2/L3 --------------------------------
auth:
  credentials_path: "credentials.json"
  token_path:       "token.json"

# --- Identity ---------------------------------------------------------------
self_email:        "chargeback-automation@gokwik.co"
self_display_name: "Chargeback Automation"
contact_email:     ""

# --- Trigger (Fraudulent Transaction) --------------------------------------
watch_sender: "accountsreceivable@gokwik.co"
extra_query:  'subject:"Urgent Attention Required" subject:"Fraudulent Transaction" -label:auto-replied-fraudulent -label:auto-logged-manual-fraudulent after:2026/05/12'
subject_regex: 'Urgent\s+Attention\s+Required.*?Fraudulent\s+Transaction'
required_from:     "accountsreceivable@gokwik.co"
required_reply_to: "chargeback@easebuzz.in"
poll_interval_seconds: 3600
auto_replied_label:        "auto-replied-fraudulent"
auto_logged_manual_label:  "auto-logged-manual-fraudulent"
auto_reminded_label:       "auto-reminded-fraudulent"
reminder_delay_hours:      48
reminder:
  template_path: "templates/reminder.html.j2"
  after_date:    "2026/05/12"

# --- Field extraction (same body shape as L1/L2/L3) ------------------------
body_table_labels:
  case_id:                 "Case ID"
  transaction_id:          "Transaction ID"
  merchant_transaction_id: "Merchant Transaction ID"
  transaction_date:        "Transaction Date Time"
  customer_name:           "Customer Name"
  customer_phone:          "Customer Phone"
  customer_email:          "Customer Email"
  dispute_amount:          "Dispute Amount"
  dispute_type:            "Dispute Type"
  merchant_name:           "__salutation__"

# --- Master Sheet LT (merchant contacts) — shared with L1/L2/L3 ------------
sheet:
  spreadsheet_id: "1OczJ8a8CFgKUTp3V8dDoEIeQOfKohsPjAuLw5gjBjKk"
  range:          "'Master Sheet LT'!A1:Z"
  name_col:       "Merchant Name"
  to_col:         "Email ID 1"
  cc_col:         "New CSM"
  status_col:     "Status"
  status_skip_csm_patterns:
    - "transferred"

merchant_contacts: {}

# --- Planhat (CSM fallback) — shared with L1/L2/L3 -------------------------
planhat:
  token_path: "planhat_token.txt"
  base_url:   "https://api.planhat.com"

# --- Always-Cc — shared with L1/L2/L3 --------------------------------------
internal_always_cc:
  - "musadiq.ahmed@gokwik.co"
  - "accountsreceivable@gokwik.co"
  - "sachin.mk@gokwik.co"
  - "chargeback@easebuzz.in"

# --- Reply ------------------------------------------------------------------
reply:
  template_path:   "templates/reply_fraudulent.html.j2"
  subject_override: ""
  reply_in_thread: true
  required_fields:
    - merchant_name

# --- Success tracker — monthly L2 tab, Fraudulent sub-section -------------
log_sheet:
  spreadsheet_id: "1r5bELHKHJhWrydAs7TWOyyC-fkFrexbIn6cUeTp0MLw"
  tab_pattern:    "{month} 26 L2"
  target_section: "Fraudulent Transaction!!"
  columns:
    - "__today__"                       # [A] Date
    - "transaction_id"                  # [B] Easebuzz Id
    - "merchant_transaction_id"         # [C] Transaction Id
    - "transaction_date"                # [D] TXN Date
    - "dispute_amount"                  # [E] TXN Amount
    - "dispute_amount"                  # [F] CBK Amount
    - "merchant_email_id"               # [G] Merchant Email id
    - "merchant_name"                   # [H] Merchant
    - "__static__:Pending with ME"      # [I] Status 1
    - "__static__:WIP"                  # [J] Ops Remarks
    - "__static__:Fraud"                # [K] Reason
    - "__static__:Sachin(bot)"          # [L] Ops POC

# --- Manual review tracker — separate Fraudulent tab ------------------------
failed_log_sheet:
  spreadsheet_id: "1BOh8xO4NEWtVQ8UfI0ef2cXGRx9guoi8FEZ6d19djbM"
  tab_pattern:    "Manual Review Fraudulent"
  columns:
    - "__today__"
    - "transaction_id"
    - "merchant_transaction_id"
    - "transaction_date"
    - "dispute_amount"
    - "dispute_amount"
    - "merchant_email_id"
    - "merchant_name"
    - "__static__:Manual Review"
    - "__static__:no recipients resolved"
    - "__static__:Fraud"
    - "__static__:Sachin(bot-skipped)"
